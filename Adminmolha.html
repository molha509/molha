<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin MOLHA</title>

    <link rel="stylesheet" href="Adminmolha.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <h1>🔐 Dashboard Admin MOLHA</h1>
        <p>Contrôle total du système des membres MOLHA</p>
    </header>

    <!-- ================= CONTROLS ================= -->
    <section class="controls">

        <!-- SEARCH -->
        <input 
            type="text" 
            id="search" 
            placeholder="🔍 Rechercher par nom, CIN/NIF, téléphone ou email..."
        >

        <!-- EXPORT BUTTON -->
        <button class="btn-export" onclick="exportCSV()">
            📥 Export CSV
        </button>

    </section>

    <!-- ================= TABLE ================= -->
    <section class="container">

        <table id="tableMembres">
            <thead>
                <tr>
                    <th>Nom & Prénom</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>CIN / NIF</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>

    </section>

    <!-- ================= MODAL VOIR ================= -->
    <div id="modalVoir" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fermerModal('modalVoir')">&times;</span>
            <h2>Détails du membre</h2>
            <div id="detailsMembre"></div>
        </div>
    </div>

    <!-- ================= MODAL EDIT ================= -->
    <div id="modalEdit" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fermerModal('modalEdit')">&times;</span>

            <h2>Modifier membre</h2>

            <form id="formEdit">
                <input type="text" id="edit_nom" placeholder="Nom & Prénom">
                <input type="text" id="edit_email" placeholder="Email">
                <input type="text" id="edit_phone" placeholder="Téléphone">
                <input type="text" id="edit_identite" placeholder="CIN / NIF">

                <button type="submit">💾 Enregistrer modifications</button>
            </form>
        </div>
    </div>

    <!-- ================= JS ================= -->
    <script src="Adminmolha.js"></script>

</body>
</html>
